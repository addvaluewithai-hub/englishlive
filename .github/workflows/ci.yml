name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run check
      - run: npm run test:ui

      - run: npm run test:practice
      - name: Trial real Practice voice on the rescue preview
        if: github.head_ref == 'feat/practice-conversation-rescue' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PRACTICE_TRIAL_ORIGIN: 'https://feat-practice-conversation-r.englishlive-a04.pages.dev'
        run: node --import tsx scripts/trial-practice-live.mjs
