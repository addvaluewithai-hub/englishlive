name: Learn classroom real-frame QA
on:
  pull_request:
    paths:
      - 'src/lessonScenes/**'
      - 'src/screens/SceneLessonScreen.tsx'
      - 'src/qa/**'
      - 'src/product-v3-premium.css'
      - 'qa.html'
      - 'scripts/capture-learn-frame-sheets.mjs'
      - 'src/qa/lessonQaRegistry.ts'
      - 'src/qa/lessonQaVisuals.ts'
      - 'package.json'
      - '.github/workflows/learn-classroom-frames.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classroom-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Typecheck and build production app
        run: npm run check
      - name: Install Playwright in ephemeral CI runner
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Capture ALL classroom beats, quiz branches and Speaking states
        run: npm run qa:learn:frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learn-classroom-frame-sheets
          path: test-results/learn-frames/
          retention-days: 30
          if-no-files-found: warn
